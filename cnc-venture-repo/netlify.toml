# CnC Venture — Netlify configuration
# Static site. No build step: `public/` is published as-is.

[build]
  publish = "public"

# Fingerprinted-ish assets: long cache. Replace an image = replace the file.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
