<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CnC Venture</title>

<!-- This document is a language gateway, not a third homepage. It carries no
     content of its own, so it must never be indexed — the two language trees
     are the canonical documents. In production Netlify answers "/" with a 302
     from _redirects before this file is ever served; it exists as a fallback
     for direct file access, prerenderers and any host without those rules. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://cncventure.org/en/">
<link rel="alternate" hreflang="en" href="https://cncventure.org/en/">
<link rel="alternate" hreflang="zh-Hant-TW" href="https://cncventure.org/zh-tw/">
<link rel="alternate" hreflang="x-default" href="https://cncventure.org/en/">
<meta name="theme-color" content="#02383D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2302383D'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23FBF8F3' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

<style>
  :root{--ink:#02383D;--warm-white:#FBF8F3;--sand:#E8DCC8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;
       background:var(--ink);color:var(--warm-white);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",
                   "Noto Sans TC",Helvetica,Arial,sans-serif;
       padding:32px;text-align:center}
  .mark{font-size:20px;letter-spacing:-.02em}
  .mark b{font-weight:600}
  .mark span{font-weight:300;opacity:.72;font-family:Georgia,serif}
  p{margin:26px 0 0;font-size:14px;opacity:.6;letter-spacing:.02em}
  ul{list-style:none;margin:30px 0 0;padding:0;display:flex;gap:12px;
     justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:14px 28px;border-radius:999px;
    border:1px solid rgba(245,241,232,.34);color:inherit;text-decoration:none;
    font-size:14.5px;transition:background .35s,border-color .35s}
  a:hover,a:focus-visible{background:rgba(245,241,232,.1);
    border-color:rgba(245,241,232,.8)}
  a:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
</style>
</head>
<body>
  <main>
    <div class="mark"><b>CnC</b> <span>Venture</span></div>
    <p>Choose a language ・ 請選擇語言</p>
    <ul>
      <li><a href="/en/" lang="en" hreflang="en">English</a></li>
      <li><a href="/zh-tw/" lang="zh-Hant" hreflang="zh-Hant-TW">繁體中文</a></li>
    </ul>
  </main>

<script>
/* Client-side fallback only. Netlify's Language-conditional redirect handles
   this server-side in production; this runs when the page is opened directly
   (local file, preview host, or a rule that did not match). Any explicit
   choice is remembered so a returning visitor is not bounced again. */
(function () {
  try {
    var chosen = localStorage.getItem('cnc-lang');
    var pick = chosen || ((navigator.languages || [navigator.language || 'en'])
      .some(function (l) { return /^zh\b/i.test(l); }) ? 'zh-tw' : 'en');
    document.querySelectorAll('a[href^="/"]').forEach(function (a) {
      a.addEventListener('click', function () {
        try { localStorage.setItem('cnc-lang', a.getAttribute('href').replace(/\//g, '')); } catch (e) {}
      });
    });
    location.replace('/' + pick + '/');
  } catch (e) { /* leave the visible links in place */ }
})();
</script>
</body>
</html>
