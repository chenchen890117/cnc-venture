# CnC Venture — bilingual static site.
#
# `npm run build` reads /content and writes the article, project and listing
# pages into /en and /zh-tw. It has no dependencies — Node's standard library
# only — so there is nothing to install and nothing that can break on a
# version bump. The two homepages are committed as built files.

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ── Caching ──────────────────────────────────────────────────────────────
# Shared assets are referenced by both language trees, so a single cached
# copy serves the whole site.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML must revalidate so copy edits go live on the next request.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# /content is the editable source for the Journal. It is read at build time and
# must never be served as a website path.
[[redirects]]
  from = "/content/*"
  to = "/en/"
  status = 301
